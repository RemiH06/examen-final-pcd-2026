# Red bridge por defecto de Compose: la UI llega a la API por el nombre del servicio (http://api:8060).
# Puertos publicados sólo en 127.0.0.1 de la máquina anfitriona.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: sms-api-image:v1
    container_name: sms-api-container
    env_file: .env            # DATABRICKS_HOST, DATABRICKS_TOKEN, MODEL_NAME, MODEL_ALIAS
    ports:
      - "127.0.0.1:8060:8060"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: sms-ui-image:v1
    container_name: sms-ui-container
    environment:
      API_URL: http://api:8060
    ports:
      - "127.0.0.1:8560:8560"
    depends_on:
      api:
        condition: service_healthy
